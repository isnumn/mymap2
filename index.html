<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 장소 검색 서비스</title>
  
  <!-- Tailwind CSS CDN (화면 레이아웃 및 스타일용) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 카카오 지도 JavaScript SDK (appkey 및 libraries 포함) -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=80bbf22d0111456cf471556fa6f0b270&libraries=services&autoload=false"></script>
  
  <style>
    /* 카카오맵 인포윈도우 커스텀 스타일 */
    .custom-infowindow {
      padding: 8px 12px;
      font-size: 13px;
      font-weight: bold;
      color: #333;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden font-sans bg-gray-100">

  <!-- 메인 컨테이너: 좌우 2분할 레이아웃 -->
  <div class="flex h-full w-full flex-col md:flex-row">
    
    <!-- [왼쪽 영역] 검색창 및 검색 결과 리스트 -->
    <div class="w-full md:w-96 h-1/2 md:h-full bg-white flex flex-col z-10 shadow-lg border-r border-gray-200">
      
      <!-- 헤더 및 검색 폼 -->
      <div class="p-4 bg-yellow-400 border-b border-yellow-500">
        <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
          📍 장소 검색 서비스
        </h1>
        <form id="search-form" class="mt-3 flex gap-2">
          <input 
            type="text" 
            id="keyword-input" 
            placeholder="검색어를 입력하세요 (예: 강남역 맛집)" 
            class="flex-1 px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"
            required
          />
          <button 
            type="submit" 
            class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition shadow-sm"
          >
            검색
          </button>
        </form>
      </div>

      <!-- 위치 정보 상태 안내 메시지 -->
      <div id="status-message" class="px-4 py-2 text-xs text-gray-500 bg-gray-50 border-b border-gray-100 flex items-center justify-between">
        <span>위치 정보를 가져오는 중...</span>
      </div>

      <!-- 검색 결과 목록 출력 리스트 -->
      <div class="flex-1 overflow-y-auto p-2">
        <ul id="places-list" class="space-y-2">
          <!-- JS로 검색 결과 항목들이 여기에 동적으로 생성됩니다 -->
          <li class="p-4 text-center text-sm text-gray-400">
            검색어를 입력하고 검색 버튼을 눌러주세요.
          </li>
        </ul>
      </div>
      
    </div>

    <!-- [오른쪽 영역] 카카오 지도 표시 영역 -->
    <div class="flex-1 h-1/2 md:h-full relative">
      <div id="map" class="w-full h-full"></div>
    </div>

  </div>

  <!-- JavaScript 연동 -->
  <script>
    // 전역 변수 선언
    let map = null;              // 지도 객체
    let ps = null;               // 카카오 장소 검색 객체
    let infowindow = null;       // 인포윈도우(말풍선) 객체
    let markers = [];            // 생성된 마커들을 관리하는 배열
    let currentLocation = null;  // 현재 사용자의 위치 (경도/위도 좌표)

    // SDK가 안전하게 완전 로드된 후 실행되도록 kakao.maps.load 사용 (로딩 오류 방지)
    kakao.maps.load(function () {
      initMap();
    });

    /**
     * 지도 및 서비스 초기화 함수
     */
    function initMap() {
      const container = document.getElementById('map');
      
      // 기본 중심 좌표 (위치 권한을 받기 전 기본값: 서울시청)
      const defaultCenter = new kakao.maps.LatLng(37.566826, 126.978656);
      
      const options = {
        center: defaultCenter,
        level: 5 // 요청하신 지도 확대 레벨 5
      };

      // 지도 객체 생성
      map = new kakao.maps.Map(container, options);

      // 장소 검색 객체 및 인포윈도우 생성
      ps = new kakao.maps.services.Places();
      infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

      // 지도 컨트롤 추가 (확대/축소)
      const zoomControl = new kakao.maps.ZoomControl();
      map.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

      // 사용자 현재 위치 가져오기
      getCurrentLocation();

      // 검색 폼 이벤트 리스너 등록
      document.getElementById('search-form').addEventListener('submit', function (e) {
        e.preventDefault();
        searchPlaces();
      });
    }

    /**
     * HTML5 Geolocation을 사용하여 현재 위치 권한을 확인하고 지도의 중심을 이동하는 함수
     */
    function getCurrentLocation() {
      const statusEl = document.getElementById('status-message');

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            currentLocation = new kakao.maps.LatLng(lat, lng);

            // 지도 중심을 현재 위치로 이동
            map.setCenter(currentLocation);

            // 현재 위치에 표시할 마커 생성
            const marker = new kakao.maps.Marker({
              position: currentLocation,
              map: map
            });

            // 현재 위치 표시 말풍선 생성
            const customOverlay = new kakao.maps.CustomOverlay({
              map: map,
              position: currentLocation,
              content: '<div class="custom-infowindow">📍 현재 위치</div>',
              yAnchor: 2.3
            });

            statusEl.innerHTML = '<span class="text-green-600 font-medium">✓ 현재 위치를 확인했습니다.</span>';
          },
          function (error) {
            console.warn('Geolocation 실패:', error.message);
            statusEl.innerHTML = '<span class="text-red-500">⚠️ 위치 권한을 허용하지 않아 기본 위치로 표시합니다.</span>';
          }
        );
      } else {
        statusEl.innerHTML = '<span class="text-red-500">⚠️ 이 브라우저는 Geolocation을 지원하지 않습니다.</span>';
      }
    }

    /**
     * 입력한 키워드로 장소를 검색하는 함수
     */
    function searchPlaces() {
      const keyword = document.getElementById('keyword-input').value.trim();

      if (!keyword) {
        alert('검색어를 입력해 주세요!');
        return;
      }

      // 검색 옵션 설정 (현재 위치가 있다면 현재 위치 중심으로 우선 검색)
      const searchOptions = {};
      if (currentLocation) {
        searchOptions.location = currentLocation;
        searchOptions.radius = 5000; // 반경 5km 이내
      }

      // 카카오 키워드 검색 API 호출
      ps.keywordSearch(keyword, placesSearchCB, searchOptions);
    }

    /**
     * 장소 검색 완료 시 호출되는 콜백 함수
     */
    function placesSearchCB(data, status) {
      if (status === kakao.maps.services.Status.OK) {
        // 기존 마커 제거 및 목록 갱신
        displayPlaces(data);
      } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        alert('검색 결과가 존재하지 않습니다.');
        clearPlacesList();
      } else if (status === kakao.maps.services.Status.ERROR) {
        alert('검색 결과 중 오류가 발생했습니다.');
      }
    }

    /**
     * 검색 결과를 리스트 및 마커로 지도에 표시하는 함수
     */
    function displayPlaces(places) {
      const listEl = document.getElementById('places-list');
      const bounds = new kakao.maps.LatLngBounds();

      // 기존 마커 및 목록 제거
      removeMarkers();
      clearPlacesList();

      places.forEach((place, index) => {
        const placePosition = new kakao.maps.LatLng(place.y, place.x);

        // 마커 생성 및 지도에 표시
        const marker = addMarker(placePosition, index);

        // 검색 영역 확장을 위한 좌표 범위 추가
        bounds.extend(placePosition);

        // 리스트 아이템 HTML 요소 생성
        const itemEl = document.createElement('li');
        itemEl.className = 'p-3 border rounded-lg hover:bg-yellow-50 cursor-pointer transition border-gray-200 bg-white shadow-sm';
        itemEl.innerHTML = `
          <div class="flex items-start gap-2">
            <span class="inline-flex items-center justify-center w-5 h-5 text-xs font-bold text-white bg-blue-500 rounded-full flex-shrink-0 mt-0.5">
              ${index + 1}
            </span>
            <div class="flex-1 overflow-hidden">
              <h5 class="font-bold text-gray-800 text-sm truncate">${place.place_name}</h5>
              <p class="text-xs text-gray-500 mt-1 truncate">${place.road_address_name || place.address_name}</p>
              ${place.phone ? `<p class="text-xs text-blue-600 mt-0.5">${place.phone}</p>` : ''}
            </div>
          </div>
        `;

        // 마커 및 리스트 항목 클릭/마우스오버 이벤트 등록
        (function (marker, title, placePosition) {
          // 마우스 오버 시 말풍선
          kakao.maps.event.addListener(marker, 'mouseover', function () {
            displayInfowindow(marker, title);
          });

          // 마우스 아웃 시 말풍선 닫기
          kakao.maps.event.addListener(marker, 'mouseout', function () {
            infowindow.close();
          });

          // 리스트 항목 클릭 시 해당 위치로 이동 및 말풍선 표시
          itemEl.onclick = function () {
            map.panTo(placePosition);
            displayInfowindow(marker, title);
          };

          // 리스트 항목 마우스오버 이벤트
          itemEl.onmouseover = function () {
            displayInfowindow(marker, title);
          };
          itemEl.onmouseout = function () {
            infowindow.close();
          };
        })(marker, place.place_name, placePosition);

        listEl.appendChild(itemEl);
      });

      // 검색된 장소들이 모두 보이도록 지도 범위 재설정
      map.setBounds(bounds);
    }

    /**
     * 지도에 마커를 생성하는 함수
     */
    function addMarker(position, idx) {
      const marker = new kakao.maps.Marker({
        position: position,
        map: map
      });

      markers.push(marker);
      return marker;
    }

    /**
     * 지도상의 모든 마커를 제거하는 함수
     */
    function removeMarkers() {
      markers.forEach(marker => marker.setMap(null));
      markers = [];
    }

    /**
     * 검색 결과 리스트를 초기화하는 함수
     */
    function clearPlacesList() {
      const listEl = document.getElementById('places-list');
      listEl.innerHTML = '';
    }

    /**
     * 마커 위에 장소명을 표시하는 인포윈도우(말풍선) 함수
     */
    function displayInfowindow(marker, title) {
      const content = `<div class="p-2 text-xs font-semibold text-gray-800">${title}</div>`;
      infowindow.setContent(content);
      infowindow.open(map, marker);
    }
  </script>
</body>
</html>
